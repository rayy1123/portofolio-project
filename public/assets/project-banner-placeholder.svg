<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bannerBg)" />

  <!-- Subtle grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.4" />
  </pattern>
  <rect width="1200" height="600" fill="url(#grid)" />

  <!-- Decorative accent blobs -->
  <circle cx="150" cy="100" r="140" fill="#1e293b" fill-opacity="0.6" />
  <circle cx="1050" cy="480" r="180" fill="#1e293b" fill-opacity="0.5" />
  <circle cx="1120" cy="120" r="80" fill="#1e293b" fill-opacity="0.4" />

  <!-- Accent vertical line left -->
  <rect x="40" y="0" width="3" height="600" fill="url(#accentLine)" />

  <!-- Code brackets decoration -->
  <text x="90" y="100" font-family="'Courier New', monospace" font-size="72"
        font-weight="bold" fill="#ef4444" fill-opacity="0.15">
    &lt;/&gt;
  </text>

  <!-- Project preview mockup (bigger, clearer) -->
  <rect x="400" y="200" width="400" height="220" rx="10"
        fill="#0f172a" stroke="#334155" stroke-width="2" />

  <!-- Mockup title bar -->
  <rect x="400" y="200" width="400" height="36" rx="10" fill="#1e293b" />
  <rect x="400" y="222" width="400" height="14" fill="#1e293b" />
  <circle cx="420" cy="218" r="5" fill="#ef4444" />
  <circle cx="436" cy="218" r="5" fill="#f59e0b" />
  <circle cx="452" cy="218" r="5" fill="#10b981" />
  <rect x="600" y="212" width="190" height="12" rx="4" fill="#334155" />

  <!-- Mockup content -->
  <rect x="420" y="256" width="360" height="12" rx="3" fill="#334155" />
  <rect x="420" y="280" width="360" height="8" rx="2" fill="#1e293b" />
  <rect x="420" y="300" width="340" height="8" rx="2" fill="#1e293b" />
  <rect x="420" y="320" width="360" height="8" rx="2" fill="#1e293b" />
  <rect x="420" y="340" width="280" height="36" rx="6" fill="#1e293b"
        stroke="#334155" stroke-width="1" />
  <rect x="420" y="388" width="180" height="12" rx="3" fill="#334155" />
  <rect x="600" y="388" width="180" height="12" rx="3" fill="#334155" />
  <rect x="420" y="416" width="100" height="32" rx="6" fill="#ef4444" />
  <rect x="532" y="416" width="100" height="32" rx="6" fill="#1e293b"
        stroke="#334155" stroke-width="1" />

  <!-- Clear instruction text (bold, visible) -->
  <text x="600" y="475" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="0.5">
    PROJECT BANNER
  </text>
  <text x="600" y="496" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="10" fill="#64748b">
    Ganti dengan screenshot proyek Anda
  </text>
</svg>
